name: Verify and publish Riftwire

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: read

concurrency:
  group: riftwire-release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the release revision and build the archive
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/heads/release/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF" == "refs/heads/release/$tag" ]]
          git fetch --no-tags --depth=1 origin "refs/heads/$DEFAULT_BRANCH"
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          version="${tag#v}"
          [[ "$(python3 -I -B riftwire.py --version)" == "Riftwire $version" ]]
          python3 -I -B scripts/build_release.py
          ( cd dist && sha256sum -c SHA256SUMS )
          mkdir release-assets
          cp -- "dist/Riftwire-$version.zip" dist/SHA256SUMS docs/RELEASE.md release-assets/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riftwire-release
          path: release-assets/
          if-no-files-found: error
  test:
    needs: build
    uses: ./.github/workflows/test.yml
  publish:
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: riftwire-release
          path: release-assets
      - name: Verify the transferred release assets
        id: assets
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/heads/release/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          file="Riftwire-${tag#v}.zip"
          [[ "$(sha256sum "$file")" == "$(cat SHA256SUMS)" ]]
          test -s RELEASE.md
          printf 'tag=%s\nfile=%s\n' "$tag" "$file" >> "$GITHUB_OUTPUT"
      - name: Attest the release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/${{ steps.assets.outputs.file }}
            release-assets/SHA256SUMS
      - name: Verify attestation and publish the release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.assets.outputs.tag }}
          RELEASE_FILE: ${{ steps.assets.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "$RELEASE_FILE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          gh release create "$RELEASE_TAG" "$RELEASE_FILE" SHA256SUMS \
            --target "$GITHUB_SHA" --title "Riftwire $RELEASE_TAG" --latest --notes-file RELEASE.md
