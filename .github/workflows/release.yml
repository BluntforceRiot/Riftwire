name: Verify and publish Riftwire

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: read

concurrency:
  group: riftwire-release-${{ github.ref }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the release revision and build the archive
        id: build
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(python3 -I -B riftwire.py --version)"
          version="${release#Riftwire }"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          [[ "$GITHUB_REF" == "refs/heads/release/$tag" ]]
          git fetch --no-tags --depth=1 origin "refs/heads/$DEFAULT_BRANCH"
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]
          python3 -I -B scripts/build_release.py
          ( cd dist && sha256sum -c SHA256SUMS )
          printf 'tag=%s\nfile=Riftwire-%s.zip\n' "$tag" "$version" >> "$GITHUB_OUTPUT"
      - name: Attest the release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/*'
      - name: Verify attestation and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          RELEASE_FILE: ${{ steps.build.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "dist/$RELEASE_FILE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          gh release create "$RELEASE_TAG" "dist/$RELEASE_FILE" dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Riftwire $RELEASE_TAG" --latest --notes-file docs/RELEASE.md
